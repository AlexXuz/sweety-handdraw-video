name: Verify packaged skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -r skills/sweety-handdraw-video/scripts/requirements.txt
      - name: Verify integrity and drawing regressions
        run: |
          python skills/sweety-handdraw-video/scripts/validate_package.py
          python -m unittest discover -s skills/sweety-handdraw-video/scripts -p 'test*.py' -v
      - name: Exercise offline pipeline and package
        run: |
          python skills/sweety-handdraw-video/scripts/smoke_test.py --output /tmp/handdraw-ci
          python tools/package.py --output dist
      - name: Report encoded stream timing
        if: always()
        run: |
          ffmpeg -version | head -1
          if test -f /tmp/handdraw-ci/outputs/film.mp4; then
            ffprobe -v error -show_entries stream=codec_name,duration,nb_frames,start_time -of json /tmp/handdraw-ci/outputs/film.mp4
            python -c "import wave; p='/tmp/handdraw-ci/work/mix.wav'; w=wave.open(p); print('Mixed WAV seconds:', w.getnframes()/w.getframerate())"
          fi
